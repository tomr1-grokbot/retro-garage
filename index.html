<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Retro Garage — M1</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #050508; color: #c8c8d0; overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    #hint {
      position: absolute; left: 8px; bottom: 6px;
      font-size: 11px; opacity: 0.45; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
  <div id="hint">PC: open index.html · Esc back · Arrows/WASD · Space gas</div>
  <script src="app.js"></script>
</body>
</html>
